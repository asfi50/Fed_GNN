name: gemma
# Gemma 4 does not work here: transformers has no sequence-classification head for
# Gemma4Config (its multimodal class), so AutoModelForSequenceClassification refuses
# it outright. Gemma3Config is supported, so this is the newest Gemma the shared
# code path can take — and at 1B it sits alongside Llama-3.2-1B for comparison.
hf_id: google/gemma-3-1b-pt
family: causal
max_length: 128
batch_size: 16
lr: 2.0e-4
gated: true
# Shipped in bf16; used where the GPU supports it, fp16 otherwise (T4 does not).
# Either way the frozen base is half precision and the trainable adapters are fp32.
preferred_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
